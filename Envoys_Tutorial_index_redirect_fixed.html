<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Envoys Tutorial — Secure Login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#10223f;min-height:100vh;display:grid;place-items:center}.box{width:min(900px,94vw);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 65px #061a3620;display:grid;grid-template-columns:42% 58%}.left{background:#061a36;color:#fff;padding:45px;display:flex;flex-direction:column;justify-content:center}.cap{font-size:58px}.left h1{font-size:38px;margin:6px 0}.gold{color:#f5bd35;font-weight:900;letter-spacing:1px}.left p{color:#cbd5e1;line-height:1.6}.right{padding:42px}.right h2{margin:0 0 7px;font-size:28px}.sub{color:#718096;margin:0 0 24px}.tabs{display:flex;border-bottom:1px solid #dce3ec;margin-bottom:18px}.tabs button{flex:1;background:none;border:0;padding:12px;font-weight:800;color:#718096}.tabs button.active{color:#1769aa;border-bottom:3px solid #f5bd35}label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button.primary{width:100%;margin-top:20px;padding:14px;border:0;border-radius:9px;background:#061a36;color:#fff;font-weight:900}button:disabled{opacity:.6}.msg{display:none;margin-top:15px;padding:12px;border-radius:9px;font-size:13px;line-height:1.45}.msg.show{display:block}.ok{background:#e9f8f1;color:#106b4d}.err{background:#fff0f1;color:#a52d38}.config{margin-top:20px;font-size:11px;color:#718096}.hidden{display:none!important}@media(max-width:700px){.box{grid-template-columns:1fr}.left{display:none}.right{padding:30px 23px}}
#portal{display:none;position:fixed;inset:0;background:#f4f7fb}.bar{height:68px;background:#061a36;color:white;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font-weight:900}.bar b{color:#f5bd35}.logout{background:none;border:1px solid #ffffff66;color:white;border-radius:8px;padding:8px 12px}.content{max-width:1000px;margin:40px auto;padding:0 22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;border:1px solid #dce3ec;border-radius:14px;padding:20px}.card small{color:#718096}.card strong{display:block;font-size:26px;margin-top:8px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="box" id="authBox">
<section class="left"><div class="cap">🎓</div><h1>THE ENVOYS</h1><div class="gold">TUTORIAL</div><p>Weekly UTME-style CBTs, results and performance tracking.</p></section>
<section class="right">
<h2>Envoys Tutorial Portal</h2><p class="sub">Your account is the key to your personal dashboard.</p>
<div class="tabs"><button type="button" id="loginTab" class="active">Log in</button><button type="button" id="signupTab">Create account</button></div>
<form id="authForm">
<div id="nameWrap" class="hidden"><label for="name">Full name</label><input id="name" autocomplete="name" placeholder="Your full name"></div>
<label for="email">Email address</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
<label for="password">Password</label><input id="password" type="password" required autocomplete="current-password" placeholder="At least 6 characters">
<button class="primary" id="submitBtn" type="submit">Log in</button>
</form>
<div id="msg" class="msg"></div>
<div class="config" id="config">Connection: checking…</div>
</section>
</div>
<div id="portal">
<div class="bar">🎓 THE <b>ENVOYS</b> TUTORIAL <button class="logout" id="logout">Log out</button></div>
<div class="content"><p>Signed in successfully.</p><h2 id="welcome">Welcome 👋🏾</h2><div class="cards"><div class="card"><small>Role</small><strong id="role">Student</strong></div><div class="card"><small>CBTs completed</small><strong>0</strong></div><div class="card"><small>Average score</small><strong>—</strong></div><div class="card"><small>Best subject</small><strong>—</strong></div></div></div>
</div>
<script>
const URL="https://hxlpfyjyfahtfieqlevp.supabase.co";
const KEY="sb_publishable_Ng5BwwYQC9Arz1zIAhqIYA_TLESNTYD";
let mode="login", accessToken=null;
const $=id=>document.getElementById(id);
function show(text,type){$("msg").textContent=text;$("msg").className="msg show "+type}
function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("signupTab").classList.toggle("active",m==="signup");$("nameWrap").classList.toggle("hidden",m!=="signup");$("submitBtn").textContent=m==="signup"?"Create account":"Log in";$("msg").className="msg"}
$("loginTab").onclick=()=>setMode("login");
$("signupTab").onclick=()=>setMode("signup");
async function request(path,options={}){
 const headers={"apikey":KEY,"Content-Type":"application/json",...(options.headers||{})};
 if(accessToken)headers.Authorization="Bearer "+accessToken;
 const r=await fetch(URL+path,{...options,headers});
 const raw=await r.text();let data=null;try{data=JSON.parse(raw)}catch{}
 if(!r.ok)throw new Error(data?.msg||data?.message||data?.error_description||raw||"Supabase request failed.");
 return data;
}
$("config").textContent="Connection: ready ✓";
$("authForm").onsubmit=async e=>{
 e.preventDefault();
 $("submitBtn").disabled=true;
 try{
  const email=$("email").value.trim(),password=$("password").value;
  if(password.length<6)throw new Error("Password must be at least 6 characters.");
  if(mode==="signup"){
   const name=$("name").value.trim();if(!name)throw new Error("Please enter your full name.");
   const redirectTo="https://ogunluyiconfam2008-eng.github.io/envoys-tutorial/";
   const d=await request("/auth/v1/signup?redirect_to="+encodeURIComponent(redirectTo),{method:"POST",body:JSON.stringify({email,password,data:{full_name:name}})});
   if(!d.access_token){
    show("Account created successfully. Supabase may require email confirmation. Check your inbox, confirm the email, then use Log in.","ok");
    setMode("login");$("password").value="";return;
   }
   await enter(d);
  }else{
   const d=await request("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});
   await enter(d);
  }
 }catch(err){show(err.message,"err")}finally{$("submitBtn").disabled=false}
};
async function enter(d){
 accessToken=d.access_token;
 let profile=null;
 try{const rows=await request("/rest/v1/profiles?id=eq."+encodeURIComponent(d.user.id)+"&select=full_name,role");profile=rows[0]}catch{}
 $("authBox").style.display="none";$("portal").style.display="block";
 $("welcome").textContent="Welcome, "+(profile?.full_name||d.user.email)+" 👋🏾";
 $("role").textContent=(profile?.role||"student").replace(/^./,x=>x.toUpperCase());
}
$("logout").onclick=async()=>{try{if(accessToken)await request("/auth/v1/logout",{method:"POST"})}catch{}accessToken=null;$("portal").style.display="none";$("authBox").style.display="grid";$("authForm").reset();setMode("login")};
</script>
</body>
</html>
